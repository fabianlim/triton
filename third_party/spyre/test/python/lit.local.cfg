# Python-driven lit tests: a ``.py`` file whose RUN line executes it and pipes the
# output through FileCheck. Same idea as the .mlir tests, for the parts of the
# backend that are Python rather than IR -- the address policy, the option surface
# -- which no pass driver can reach.
import os

config.suffixes = list(config.suffixes) + [".py"]

# These files are named `*-test.py`, with a HYPHEN, and that matters: pytest
# collects `test_*.py` and `*_test.py`, so an underscore here would have the
# pytest suite collect and re-run every one of them alongside lit. Do not
# "fix" the hyphen.

# lit does not load ``conftest.py``, so the imports these tests need are arranged
# here instead: ``triton`` from this source checkout rather than an installed
# wheel, so the tests follow the tree, and ``third_party/spyre`` so SpyreBackend
# can find its own ``backend.compiler``.
#
# Written onto config.environment directly. llvm_config.with_environment is the
# usual way, but that object belongs to the parent lit.cfg.py and is not in a
# lit.local.cfg's scope.
_test_root = config.test_source_root                    # .../third_party/spyre/test
_spyre_root = os.path.dirname(_test_root)               # .../third_party/spyre
_repo_root = os.path.dirname(os.path.dirname(_spyre_root))
# _test_root too, for the shared backend_utils module.
_paths = [os.path.join(_repo_root, "python"), _spyre_root, _test_root]
if config.environment.get("PYTHONPATH"):
    _paths.append(config.environment["PYTHONPATH"])
config.environment["PYTHONPATH"] = os.pathsep.join(_paths)
